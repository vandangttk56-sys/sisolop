<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Điểm Danh Lớp Học</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">HỆ THỐNG ĐIỂM DANH HỌC SINH</h1>

        <!-- Chọn Lớp & Buổi -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Chọn Lớp:</label>
                <select id="selectClass" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="onClassChange()">
                    <!-- Được nạp tự động từ GAS -->
                </select>
            </div>
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Buổi học:</label>
                <select id="selectSession" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Sáng">Sáng</option>
                    <option value="Chiều">Chiều</option>
                </select>
            </div>
        </div>

        <!-- Trạng thái dữ liệu đã lưu gần nhất (Hiển thị cho người vào sau xem) -->
        <div id="historyBox" class="mb-6 p-4 bg-blue-50 border border-blue-200 rounded-lg hidden">
            <h3 class="font-bold text-blue-800 mb-1">📋 Trạng thái điểm danh gần nhất:</h3>
            <p class="text-sm text-gray-600 mb-2">Thời gian lưu: <span id="lblTime" class="font-medium text-gray-800">---</span></p>
            <div class="grid grid-cols-3 gap-2 text-center mb-2">
                <div class="bg-white p-2 rounded border"><span class="block text-xs text-gray-500">Tổng số</span><strong id="lblTotal" class="text-lg">0</strong></div>
                <div class="bg-white p-2 rounded border"><span class="block text-xs text-gray-500">Có mặt</span><strong id="lblPresent" class="text-lg text-green-600">0</strong></div>
                <div class="bg-white p-2 rounded border"><span class="block text-xs text-gray-500">Vắng</span><strong id="lblAbsent" class="text-lg text-red-600">0</strong></div>
            </div>
            <p class="text-sm text-gray-700"><strong>Học sinh vắng:</strong> <span id="lblAbsentNames" class="text-red-600 font-medium">Không có</span></p>
        </div>

        <!-- Danh sách học sinh để tích chọn -->
        <div class="mb-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-3">Danh sách học sinh (Tích chọn nếu vắng):</h2>
            <div id="studentListContainer" class="border rounded-lg p-4 max-h-60 overflow-y-auto space-y-2 bg-gray-50">
                <p class="text-gray-500 text-center">Đang tải dữ liệu...</p>
            </div>
        </div>

        <!-- Nhập mật khẩu và nút Lưu -->
        <div class="border-t pt-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="w-full md:w-1/2">
                <label class="block text-gray-700 font-semibold mb-1">Mật khẩu xác thực:</label>
                <input type="password" id="inputPassword" placeholder="Nhập mật khẩu..." class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="w-full md:w-auto flex items-end">
                <button onclick="submitData()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-lg shadow transition">
                    Lưu Điểm Danh
                </button>
            </div>
        </div>

        <!-- Thông báo kết quả -->
        <div id="statusMessage" class="mt-4 text-center font-medium hidden"></div>
    </div>

    <script>
        // ======= QUAN TRỌNG: DÁN URL WEB APP CỦA BẠN VÀO ĐÂY =======
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyPb4Txkqa8XJvPtSRMyEnL46-8cnQUml2fgUzzPa7P_IeqHjKMW8XM4PmKSssUjZZR/exec";

        let appData = {};

        // Khi mở trang, gọi dữ liệu từ GAS lên
        window.onload = function() {
            fetch(WEB_APP_URL + "?action=getData")
                .then(res => res.json())
                .then(data => {
                    appData = data;
                    renderClasses();
                    renderStudents();
                    showHistoryForCurrentClass();
                })
                .catch(err => {
                    document.getElementById("studentListContainer").innerHTML = '<p class="text-red-500 text-center">Không thể kết nối đến Google Sheets!</p>';
                });
        };

        // Đổ danh sách lớp vào dropdown
        function renderClasses() {
            const select = document.getElementById("selectClass");
            select.innerHTML = "";
            if (appData.classes) {
                appData.classes.forEach(c => {
                    let opt = document.createElement("option");
                    opt.value = c;
                    opt.textContent = "Lớp " + c;
                    select.appendChild(opt);
                });
            }
        }

        // Khi thay đổi lớp, hiển thị lại danh sách học sinh và lịch sử của lớp đó
        function onClassChange() {
            renderStudents();
            showHistoryForCurrentClass();
        }

        // Hiển thị danh sách học sinh theo lớp được chọn
        function renderStudents() {
            const className = document.getElementById("selectClass").value;
            const container = document.getElementById("studentListContainer");
            container.innerHTML = "";

            let students = (appData.studentsByClass && appData.studentsByClass[className]) ? appData.studentsByClass[className] : [];

            if (students.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center">Không có học sinh nào trong lớp này.</p>';
                return;
            }

            students.forEach(st => {
                let div = document.createElement("label");
                div.className = "flex items-center space-x-3 p-2 bg-white rounded border cursor-pointer hover:bg-gray-100";
                div.innerHTML = `
                    <input type="checkbox" name="studentCheck" value="${st.name}" data-id="${st.id}" class="w-4 h-4 text-blue-600 rounded">
                    <span class="text-gray-600 font-mono text-sm">${st.id}</span>
                    <span class="text-gray-800 font-medium">${st.name}</span>
                `;
                container.appendChild(div);
            });
        }

        // Hiển thị lịch sử điểm danh đã lưu gần nhất cho người vào sau xem
        function showHistoryForCurrentClass() {
            const className = document.getElementById("selectClass").value;
            const historyBox = document.getElementById("historyBox");
            
            if (appData.attendanceHistory && appData.attendanceHistory[className]) {
                let record = appData.attendanceHistory[className];
                document.getElementById("lblTime").textContent = record.time + " (" + record.ngay + " - Buổi " + record.buoi + ")";
                document.getElementById("lblTotal").textContent = record.totalStudents;
                document.getElementById("lblPresent").textContent = record.presentCount;
                document.getElementById("lblAbsent").textContent = record.absentCount;
                document.getElementById("lblAbsentNames").textContent = record.absentNames || "Không có (Đi học đầy đủ)";
                historyBox.classList.remove("hidden");
            } else {
                historyBox.classList.add("hidden");
            }
        }

        // Gửi dữ liệu điểm danh khi bấm Lưu
        function submitData() {
            const className = document.getElementById("selectClass").value;
            const session = document.getElementById("selectSession").value;
            const password = document.getElementById("inputPassword").value;
            const msgBox = document.getElementById("statusMessage");

            if (!password) {
                alert("Vui lòng nhập mật khẩu!");
                return;
            }

            let checkboxes = document.querySelectorAll('input[name="studentCheck"]:checked');
            let absentNamesArr = [];
            checkboxes.forEach(cb => {
                absentNamesArr.push(cb.value);
            });

            let totalStudents = (appData.studentsByClass && appData.studentsByClass[className]) ? appData.studentsByClass[className].length : 0;
            let absentCount = absentNamesArr.length;
            let absentNamesStr = absentNamesArr.length > 0 ? absentNamesArr.join(", ") : "Không có";

            let payload = {
                action: "submitAttendance",
                className: className,
                session: session,
                password: password,
                totalStudents: totalStudents,
                absentCount: absentCount,
                absentNames: absentNamesStr
            };

            msgBox.classList.remove("hidden", "text-red-600", "text-green-600");
            msgBox.textContent = "Đang lưu dữ liệu lên hệ thống...";

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if (res.success) {
                    msgBox.className = "mt-4 text-center font-medium text-green-600";
                    msgBox.textContent = "Điểm danh thành công lúc " + res.time + "!";
                    
                    // Cập nhật lại biến local và hiển thị lại box lịch sử ngay lập tức
                    if (!appData.attendanceHistory) appData.attendanceHistory = {};
                    appData.attendanceHistory[className] = {
                        ngay: new Date().toLocaleDateString('vi-VN'),
                        buoi: session,
                        totalStudents: totalStudents,
                        presentCount: totalStudents - absentCount,
                        absentCount: absentCount,
                        absentNames: absentNamesStr,
                        time: res.time
                    };
                    showHistoryForCurrentClass();
                } else {
                    msgBox.className = "mt-4 text-center font-medium text-red-600";
                    msgBox.textContent = "Lỗi: " + res.message;
                }
            })
            .catch(err => {
                msgBox.className = "mt-4 text-center font-medium text-red-600";
                msgBox.textContent = "Lỗi kết nối đến máy chủ!";
            });
        }
    </script>
</body>
</html>
